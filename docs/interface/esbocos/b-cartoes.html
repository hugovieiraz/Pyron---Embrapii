<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esboço B · Cartões de trabalho</title>
<link rel="stylesheet" href="../../../app/estatico/tokens.css">
<link rel="stylesheet" href="comum/cores.css">
<style>
/* Direção B: cartões de trabalho. Densidade média: blocos brancos sobre fundo frio, números grandes,
   lista e detalhe no mesmo painel (a região selecionada abre no lugar). */
:root {
  /* propostas de token desta direção */
  --b-ind-altura: 112px;
}
* { box-sizing: border-box; margin: 0; }
body { font: var(--p-normal) var(--t-2) / var(--a-2) var(--fonte); color: var(--texto); background: var(--fundo); height: 100vh; overflow: hidden; display: grid; grid-template-columns: var(--lateral) 1fr; }
.ic { width: var(--ic); height: var(--ic); fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

.lateral { border-right: 1px solid var(--lateral-borda-dir); background: linear-gradient(180deg, var(--lateral-topo), var(--lateral-base)); color: var(--lateral-texto); display: flex; flex-direction: column; padding: var(--e-4) var(--e-3); gap: var(--e-1); }
.marca { display: flex; align-items: center; gap: var(--e-3); padding: var(--e-1) var(--e-2) var(--e-6); font-weight: var(--p-forte); font-size: var(--t-3); color: var(--lateral-marca); }
.marca img { width: var(--e-10); height: var(--e-10); border-radius: var(--r-m); background: var(--branco); border: 1px solid var(--borda); }
.nav a { display: flex; align-items: center; gap: var(--e-3); height: var(--alvo); padding: 0 var(--e-3); border-radius: var(--r-m); color: inherit; text-decoration: none; font-weight: var(--p-medio); }
.nav a .ic { width: var(--ic-g); height: var(--ic-g); }
.nav a:hover { background: var(--lateral-hover); }
.nav a.ativo { background: var(--lateral-ativo); color: var(--lateral-ativo-texto); }
.nav a .cont { margin-left: auto; font-size: var(--t-1); background: var(--urgente); color: var(--branco); border-radius: var(--r-g); padding: 0 var(--e-2); }
.lateral .rodape { margin-top: auto; }

.principal { display: grid; grid-template-rows: var(--topo) 1fr; min-width: 0; height: 100vh; }
.topo { display: flex; align-items: center; gap: var(--e-4); padding: 0 var(--e-6); background: var(--superficie); border-bottom: 1px solid var(--borda); }
.trilha { color: var(--texto-3); display: flex; gap: var(--e-2); }
.trilha b { color: var(--texto); font-weight: var(--p-medio); }
.busca { margin: 0 auto; width: var(--col-g); display: flex; align-items: center; gap: var(--e-2); height: var(--alvo); padding: 0 var(--e-3); border: 1px solid var(--borda); border-radius: var(--r-m); color: var(--texto-3); }
.busca kbd { margin-left: auto; font: var(--t-1) var(--fonte-num); }
.sino { width: var(--alvo); height: var(--alvo); display: grid; place-items: center; border-radius: var(--r-m); color: var(--texto-2); }

.tela { display: none; min-height: 0; padding: var(--e-5) var(--e-6); gap: var(--e-4); }
.tela.ativa { display: grid; }
.cab { display: flex; align-items: center; gap: var(--e-3); }
.cab h1 { font-size: var(--t-5); line-height: var(--a-5); font-weight: var(--p-forte); }
.cab .meta { color: var(--texto-3); display: flex; gap: var(--e-3); align-items: center; flex-wrap: wrap; }
.cab .acoes { margin-left: auto; display: flex; gap: var(--e-2); }
.btn { display: inline-flex; align-items: center; gap: var(--e-2); height: var(--alvo); padding: 0 var(--e-4); border-radius: var(--r-m); border: 1px solid var(--borda-campo); background: var(--superficie); font-weight: var(--p-medio); }
.btn.pri { background: var(--acao); border-color: var(--acao); color: var(--acao-texto); }
.btn.ic-so { padding: 0; width: var(--alvo); justify-content: center; }
.cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--r-g); box-shadow: var(--sombra-1); min-height: 0; }
.cartao > h2 { font-size: var(--t-3); line-height: var(--a-3); font-weight: var(--p-medio); padding: var(--e-4) var(--e-5) var(--e-2); display: flex; align-items: baseline; gap: var(--e-2); }
.cartao > h2 a { margin-left: auto; font-size: var(--t-2); color: var(--acao); text-decoration: none; }
.cartao > h2 small { font-size: var(--t-2); color: var(--texto-3); font-weight: var(--p-normal); }
.selo { display: inline-flex; align-items: center; font-size: var(--t-1); line-height: var(--a-1); font-weight: var(--p-medio); padding: 2px var(--e-2); border-radius: var(--r-g); }
.selo.normal { background: var(--normal-fundo); color: var(--normal-texto); }
.selo.atencao { background: var(--atencao-fundo); color: var(--atencao-texto); }
.selo.programar { background: var(--programar-fundo); color: var(--programar-texto); }
.selo.urgente { background: var(--urgente-fundo); color: var(--urgente-texto); }
.selo.imediato { background: var(--imediato-fundo); color: var(--imediato-texto); }

/* painel */
#t-painel { grid-template-rows: auto var(--b-ind-altura) 1fr; }
.inds { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--e-4); }
.ind { text-align: left; padding: var(--e-4) var(--e-5); display: grid; align-content: space-between; border-top: 4px solid var(--sev, var(--borda)); }
.ind .rot { color: var(--texto-2); font-weight: var(--p-medio); }
.ind .val { font-size: var(--t-6); line-height: var(--a-6); font-weight: var(--p-forte); }
.ind .nota { color: var(--texto-3); font-size: var(--t-1); }
.ind .linha { display: flex; align-items: baseline; gap: var(--e-2); }
.grade-painel { display: grid; grid-template-columns: 2fr 1fr; gap: var(--e-4); min-height: 0; }
.col-dir { display: grid; grid-template-rows: auto 1fr; gap: var(--e-4); min-height: 0; }
.itens { list-style: none; padding: 0 var(--e-3) var(--e-3); overflow: auto; }
.item { display: grid; grid-template-columns: 4px 1fr auto auto; gap: var(--e-4); align-items: center; padding: var(--e-3); border-radius: var(--r-m); }
.item:hover { background: var(--superficie-2); }
.item + .item { border-top: 1px solid var(--borda); }
.item i { align-self: stretch; border-radius: 2px; background: var(--sev); }
.item .eq { font-weight: var(--p-medio); }
.item .eq small, .item .reg small { display: block; font-weight: var(--p-normal); color: var(--texto-3); font-size: var(--t-1); line-height: var(--a-1); }
.item .t { font-size: var(--t-4); line-height: var(--a-4); font-weight: var(--p-forte); text-align: right; min-width: var(--col-num); }
.item .t small { display: block; font-size: var(--t-1); line-height: var(--a-1); font-weight: var(--p-normal); color: var(--texto-3); }
.item .pend { color: var(--texto-2); font-size: var(--t-1); text-align: right; }
.item .pend.venc { color: var(--erro-texto); font-weight: var(--p-medio); }
.prox { list-style: none; padding: 0 var(--e-5) var(--e-3); }
.prox li { display: flex; justify-content: space-between; gap: var(--e-3); padding: var(--e-2) 0; border-top: 1px solid var(--borda); }
.prox li:first-child { border-top: 0; }
.prox small { display: block; color: var(--texto-3); font-size: var(--t-1); line-height: var(--a-1); }
.prox .q { text-align: right; }
.prox .q.venc { color: var(--erro-texto); font-weight: var(--p-medio); }
.estado { padding: 0 var(--e-5) var(--e-4); display: grid; gap: var(--e-2); }
.estado .lin { display: grid; grid-template-columns: var(--col-num) 1fr auto; align-items: center; gap: var(--e-3); }
.estado .lin b { justify-self: end; }
.estado .barra { height: var(--e-2); background: var(--superficie-3); border-radius: var(--r-p); overflow: hidden; }
.estado .barra i { display: block; height: 100%; background: var(--sev); border-radius: var(--r-p); }

/* análise */
#t-analise { grid-template-rows: auto 1fr; }
.area { display: grid; grid-template-columns: 1fr var(--inspetor); gap: var(--e-4); min-height: 0; }
.termo { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.ferr { display: flex; align-items: center; gap: var(--e-1); padding: var(--e-2) var(--e-3); border-bottom: 1px solid var(--borda); }
.ferr button { height: var(--alvo-sm); min-width: var(--alvo-sm); padding: 0 var(--e-2); border-radius: var(--r-p); display: inline-flex; align-items: center; justify-content: center; gap: var(--e-2); color: var(--texto-2); font-weight: var(--p-medio); }
.ferr button:hover { background: var(--superficie-2); }
.ferr button.on { background: var(--acao-suave); color: var(--acao-hover); }
.ferr .sep { width: 1px; height: var(--e-5); background: var(--borda); margin: 0 var(--e-2); }
.ferr .dir { margin-left: auto; }
.quadro { background: var(--palco); position: relative; container-type: size; display: grid; place-items: center; min-height: 0; }
.img { position: relative; width: min(calc(100cqw - var(--e-24)), calc((100cqh - var(--e-8)) * 4 / 3)); aspect-ratio: 4 / 3; }
.img canvas { width: 100%; height: 100%; display: block; }
.caixa { position: absolute; border: 2px solid; border-radius: 2px; }
.caixa.selecionada { box-shadow: 0 0 0 2px var(--branco); }
.etq { position: absolute; left: -2px; bottom: 100%; margin-bottom: 2px; white-space: nowrap; font-size: var(--t-1); line-height: var(--a-1); padding: 0 var(--e-1); border-radius: 2px; background: var(--rotulo-imagem); color: var(--branco); }
.escala { position: absolute; right: var(--e-4); top: var(--e-8); bottom: var(--e-8); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; gap: var(--e-1); color: var(--palco-texto); font-size: var(--t-1); }
.escala canvas { width: var(--e-3); height: 100%; border-radius: 2px; }
.insp { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.abas { display: flex; gap: var(--e-1); padding: var(--e-2); border-bottom: 1px solid var(--borda); }
.abas button { flex: 1; height: var(--alvo-sm); border-radius: var(--r-p); color: var(--texto-2); font-weight: var(--p-medio); }
.abas button.on { background: var(--superficie-3); color: var(--texto); }
.lista { overflow: auto; padding: var(--e-2); display: grid; gap: var(--e-1); align-content: start; }
.reg { border-radius: var(--r-m); border: 1px solid transparent; }
.reg > button { width: 100%; display: grid; grid-template-columns: 4px 1fr auto auto; gap: var(--e-3); align-items: center; padding: var(--e-2) var(--e-3); text-align: left; }
.reg > button i { align-self: stretch; border-radius: 2px; background: var(--sev); }
.reg .n { font-weight: var(--p-medio); }
.reg .n small { display: block; color: var(--texto-3); font-weight: var(--p-normal); font-size: var(--t-1); line-height: var(--a-1); }
.reg .t { font-weight: var(--p-forte); }
.reg:hover { background: var(--superficie-2); }
.reg.sel { border-color: var(--acao-suave-2); background: var(--acao-suave); }
.aberto { padding: 0 var(--e-3) var(--e-3) var(--e-6); display: grid; gap: var(--e-3); }
.leituras { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--e-2); }
.leituras div { background: var(--superficie); border-radius: var(--r-p); padding: var(--e-2); }
.leituras small { display: block; color: var(--texto-3); font-size: var(--t-1); line-height: var(--a-1); }
.leituras b { font-size: var(--t-3); line-height: var(--a-3); }
.aberto p { color: var(--texto-2); }
.aberto p b { color: var(--texto); }
.aberto dl { display: grid; grid-template-columns: auto 1fr; gap: var(--e-1) var(--e-3); }
.aberto dt { color: var(--texto-3); }
.aberto dd { text-align: right; font-weight: var(--p-medio); }
.aberto .acoes-reg { display: flex; gap: var(--e-2); }
.aberto .acoes-reg .btn { height: var(--alvo-sm); padding: 0 var(--e-3); }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
</style>
</head>
<body>
<aside class="lateral">
  <div class="marca"><img src="../../../app/estatico/marca/icone-192.png" alt="">Pyron</div>
  <nav class="nav" id="nav"></nav>
  <nav class="nav rodape"><a href="#"><svg class="ic"><use href="#i-config"/></svg>Configurações</a></nav>
</aside>
<div class="principal">
  <header class="topo">
    <div class="trilha" id="trilha"></div>
    <div class="busca"><svg class="ic"><use href="#i-busca"/></svg>Buscar<kbd>Ctrl K</kbd></div>
    <button class="sino" aria-label="Alertas"><svg class="ic"><use href="#i-sino"/></svg></button>
  </header>

  <section class="tela" id="t-painel">
    <div class="cab"><h1>Painel</h1><div class="acoes"><button class="btn pri"><svg class="ic"><use href="#i-importar"/></svg>Importar termogramas</button></div></div>
    <div class="inds" id="ind"></div>
    <div class="grade-painel">
      <div class="cartao" style="display:grid;grid-template-rows:auto 1fr;min-height:0"><h2>Atenção agora <small>pior região da última inspeção</small></h2><ul class="itens" id="atencao"></ul></div>
      <div class="col-dir">
        <div class="cartao"><h2>Estado dos equipamentos <small>18</small></h2><div class="estado" id="estado"></div></div>
        <div class="cartao" style="overflow:auto"><h2>Próximas inspeções <a href="#">Equipamentos</a></h2><ul class="prox" id="prox"></ul></div>
      </div>
    </div>
  </section>

  <section class="tela" id="t-analise">
    <div class="cab" id="cab-analise"></div>
    <div class="area">
      <div class="cartao termo">
        <div class="ferr">
          <button class="on" aria-label="Selecionar"><svg class="ic"><use href="#i-selecionar"/></svg></button>
          <button aria-label="Nova região"><svg class="ic"><use href="#i-regiao"/></svg></button>
          <button aria-label="Ponto"><svg class="ic"><use href="#i-ponto"/></svg></button>
          <button aria-label="Linha"><svg class="ic"><use href="#i-linha"/></svg></button>
          <span class="sep"></span>
          <button>Ferro</button>
          <button>22–60 °C</button>
          <button><svg class="ic"><use href="#i-camadas"/></svg>Camadas</button>
          <button class="dir"><svg class="ic"><use href="#i-foto"/></svg>Foto</button>
        </div>
        <div class="quadro">
          <div class="img" id="img"><canvas id="termo"></canvas></div>
          <div class="escala"><span>60</span><canvas id="escala"></canvas><span>22</span></div>
        </div>
      </div>
      <div class="cartao insp">
        <div class="abas"><button class="on">Regiões 7</button><button>Condições</button><button>Identificação</button></div>
        <div class="lista" id="lista"></div>
      </div>
    </div>
  </section>
</div>
<script src="comum/icones.js"></script>
<script src="comum/dados.js"></script>
<script src="comum/termograma.js"></script>
<script src="comum/medir.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const NAV = [["painel", "Painel"], ["inspecoes", "Inspeções"], ["equipamentos", "Equipamentos"], ["pendencias", "Pendências", 3], ["captura", "Captura"], ["modelos", "Modelos"]];

function montar() {
  const tela = location.hash === "#analise" ? "analise" : "painel";
  document.querySelectorAll(".tela").forEach((t) => t.classList.toggle("ativa", t.id === `t-${tela}`));
  const ativo = tela === "analise" ? "inspecoes" : "painel";
  $("#nav").innerHTML = NAV.map(([id, n, c]) => `<a href="#" class="${id === ativo ? "ativo" : ""}">${ic(id)}${n}${c ? `<span class="cont">${c}</span>` : ""}</a>`).join("");
  $("#trilha").innerHTML = tela === "analise" ? `Inspeções <span>›</span> <b>${DADOS.analise.arquivo}</b>` : "<b>Painel</b>";
}

function painel() {
  const P = DADOS.painel;
  $("#ind").innerHTML = P.indicadores.map((k) => `<button class="cartao ind" style="${k.severidade ? `--sev:var(--${k.severidade})` : ""}"><span class="rot">${k.rotulo}</span><span class="linha"><span class="val num">${k.valor}</span><span class="nota">${k.nota}</span></span></button>`).join("");
  $("#atencao").innerHTML = P.atencao.map((a) => `<li class="item" style="--sev:var(--${a.severidade})"><i></i><span class="eq">${a.equipamento}<small>${a.instalacao}, ${a.data}</small></span><span class="reg">${a.regiao}<small>${a.criterio}</small></span><span class="t num">${fmt(a.tmax)} °C<small><span class="selo ${a.severidade}">${NIVEIS[a.severidade]}</span></small></span></li>`).join("");
  $("#prox").innerHTML = P.proximas.map((p) => `<li><span>${p.equipamento}<small>${p.instalacao}</small></span><span class="q ${p.atraso.startsWith("vencida") ? "venc" : ""}">${p.data}<small>${p.atraso}</small></span></li>`).join("");
  const max = Math.max(...P.estados.map((e) => e.n));
  $("#estado").innerHTML = P.estados.map((e) => `<div class="lin" style="--sev:var(--${e.severidade})"><span>${NIVEIS[e.severidade]}</span><span class="barra"><i style="width:${(e.n / max) * 100}%"></i></span><b class="num">${e.n}</b></div>`).join("");
}

function analise() {
  const A = DADOS.analise;
  const sel = A.regioes[0];
  $("#cab-analise").innerHTML = `<button class="btn ic-so" aria-label="Anterior">${ic("anterior")}</button><div><h1>${A.equipamento}</h1><div class="meta"><span class="selo ${A.severidade}">${NIVEIS[A.severidade]}</span><span>${A.instalacao}</span><span>${A.data}</span><span>${A.arquivo}</span><span>${A.posicao[0]} de ${A.posicao[1]}</span></div></div><button class="btn ic-so" aria-label="Próxima">${ic("proxima")}</button><div class="acoes"><button class="btn">${ic("detectar")}Detectar de novo</button><button class="btn ic-so" aria-label="Mais">${ic("mais")}</button><button class="btn pri">${ic("laudo")}Gerar laudo</button></div>`;
  desenharTermograma($("#termo"));
  desenharEscala($("#escala"));
  caixasRegioes($("#img"), A.regioes, { selecionada: sel.id });
  $("#lista").innerHTML = A.regioes.map((r) => {
    const linha = `<button style="--sev:var(--${r.severidade})"><i></i><span class="n">${r.nome}<small>${r.classe}${r.fase ? `, fase ${r.fase}` : ""}</small></span><span class="t num">${fmt(r.tmax)} °C</span><span class="selo ${r.severidade}">${NIVEIS[r.severidade]}</span></button>`;
    if (r.id !== sel.id) return `<div class="reg">${linha}</div>`;
    const b = A.regioes[3];
    return `<div class="reg sel">${linha}<div class="aberto">
      <div class="leituras"><div><small>Tmáx</small><b class="num">${fmt(r.tmax)} °C</b></div><div><small>ΔT fase</small><b class="num">${fmt(r.dt)} °C</b></div><div><small>MTA</small><b class="num">${r.mta} %</b></div></div>
      <p><b>${r.acao}</b> ${r.criterio}.</p>
      <dl><dt>Pendência</dt><dd style="color:var(--erro-texto)">Aberta, prazo 13/10</dd><dt>Dimensões (${b.nome})</dt><dd class="num">${fmt(b.dimensoes.altura, 2)} × ${fmt(b.dimensoes.largura, 2)} m</dd></dl>
      <div class="acoes-reg"><button class="btn">${ic("regua")}Medir</button><button class="btn">Ver pendência</button></div>
    </div></div>`;
  }).join("");
}

addEventListener("hashchange", montar);
addEventListener("DOMContentLoaded", () => { montar(); painel(); analise(); });
</script>
</body>
</html>
