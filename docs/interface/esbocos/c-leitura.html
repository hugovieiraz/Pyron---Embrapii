<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esboço C · Leitura ampla</title>
<link rel="stylesheet" href="../../../app/estatico/tokens.css">
<link rel="stylesheet" href="comum/cores.css">
<style>
/* Direção C: leitura ampla. Navegação no topo (toda a largura para o conteúdo), uma escala acima
   (corpo 17 px, números 30 px), poucos itens por tela: pensada para o projetor e para ler de pé. */
:root {
  /* propostas de token desta direção */
  --c-topo: 56px;
  --c-faixa: 88px;
  --c-painel: 400px;
}
* { box-sizing: border-box; margin: 0; }
body { font: var(--p-normal) var(--t-3) / var(--a-3) var(--fonte); color: var(--texto); background: var(--superficie); height: 100vh; overflow: hidden; display: grid; grid-template-rows: var(--c-topo) 1fr; }
.ic { width: var(--ic-g); height: var(--ic-g); fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

.topo { display: flex; align-items: center; gap: var(--e-2); padding: 0 var(--e-6); border-bottom: 1px solid var(--borda); }
.marca { display: flex; align-items: center; gap: var(--e-2); font-weight: var(--p-forte); margin-right: var(--e-6); }
.marca img { width: var(--e-8); height: var(--e-8); }
.nav { display: flex; height: 100%; }
.nav a { display: flex; align-items: center; gap: var(--e-2); padding: 0 var(--e-4); color: var(--texto-2); text-decoration: none; font-weight: var(--p-medio); font-size: var(--t-2); border-bottom: 3px solid transparent; }
.nav a:hover { color: var(--texto); }
.nav a.ativo { color: var(--acao-hover); border-bottom-color: var(--acao); }
.nav a .cont { font-size: var(--t-1); line-height: var(--a-1); background: var(--urgente); color: var(--branco); border-radius: var(--r-g); padding: 0 var(--e-2); }
.topo .dir { margin-left: auto; display: flex; gap: var(--e-1); }
.topo .dir button { width: var(--alvo); height: var(--alvo); display: grid; place-items: center; border-radius: var(--r-m); color: var(--texto-2); }

.tela { display: none; min-height: 0; }
.tela.ativa { display: grid; }
.cab { display: flex; align-items: center; gap: var(--e-4); padding: var(--e-4) var(--e-6); }
.cab h1 { font-size: var(--t-5); line-height: var(--a-5); font-weight: var(--p-forte); }
.cab .meta { color: var(--texto-3); font-size: var(--t-2); display: flex; gap: var(--e-3); align-items: center; }
.cab .acoes { margin-left: auto; display: flex; gap: var(--e-2); }
.btn { display: inline-flex; align-items: center; gap: var(--e-2); height: var(--alvo-toque); padding: 0 var(--e-4); border-radius: var(--r-m); border: 1px solid var(--borda-campo); background: var(--superficie); font-weight: var(--p-medio); font-size: var(--t-2); }
.btn.pri { background: var(--acao); border-color: var(--acao); color: var(--acao-texto); }
.btn.ic-so { padding: 0; width: var(--alvo-toque); justify-content: center; }
.selo { display: inline-flex; align-items: center; font-size: var(--t-2); line-height: var(--a-2); font-weight: var(--p-medio); padding: 2px var(--e-3); border-radius: var(--r-g); }
.selo.normal { background: var(--normal-fundo); color: var(--normal-texto); }
.selo.atencao { background: var(--atencao-fundo); color: var(--atencao-texto); }
.selo.programar { background: var(--programar-fundo); color: var(--programar-texto); }
.selo.urgente { background: var(--urgente-fundo); color: var(--urgente-texto); }
.selo.imediato { background: var(--imediato-fundo); color: var(--imediato-texto); }
h2 { font-size: var(--t-3); line-height: var(--a-3); font-weight: var(--p-medio); color: var(--texto-2); }

/* painel */
#t-painel { grid-template-rows: auto 1fr; }
.grade { display: grid; grid-template-columns: 1fr var(--c-painel); gap: var(--e-8); padding: 0 var(--e-6) var(--e-6); min-height: 0; }
.fila { display: grid; gap: var(--e-1); align-content: start; overflow: auto; }
.grande { display: grid; grid-template-columns: 6px 1fr auto; gap: var(--e-5); align-items: center; padding: var(--e-3) var(--e-5) var(--e-3) 0; border-bottom: 1px solid var(--borda); }
.grande i { align-self: stretch; background: var(--sev); border-radius: 3px; }
.grande .eq b { display: block; font-size: var(--t-4); line-height: var(--a-4); }
.grande .eq span { color: var(--texto-3); font-size: var(--t-2); }
.grande .t { text-align: right; }
.grande .t b { display: block; font-size: var(--t-6); line-height: var(--a-6); }
.grande .t span { font-size: var(--t-2); color: var(--texto-3); }
.lado { display: grid; gap: var(--e-6); align-content: start; }
.blocos { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e-3); }
.bloco { text-align: left; padding: var(--e-4); border-radius: var(--r-m); background: var(--superficie-2); display: grid; gap: var(--e-1); }
.bloco b { font-size: var(--t-6); line-height: var(--a-6); color: var(--sev, var(--texto)); }
.bloco span { font-size: var(--t-2); color: var(--texto-2); }
.prox { list-style: none; padding: 0; }
.prox li { display: flex; justify-content: space-between; padding: var(--e-2) 0; border-bottom: 1px solid var(--borda); font-size: var(--t-2); }
.prox .venc { color: var(--erro-texto); font-weight: var(--p-medio); }

/* análise */
#t-analise { grid-template-rows: auto 1fr; }
.area { display: grid; grid-template-columns: 1fr var(--c-painel); min-height: 0; border-top: 1px solid var(--borda); }
.esq { display: grid; grid-template-rows: 1fr var(--c-faixa); min-height: 0; min-width: 0; }
.quadro { background: var(--palco); position: relative; container-type: size; display: grid; place-items: center; min-height: 0; }
.img { position: relative; width: min(calc(100cqw - var(--e-24)), calc((100cqh - var(--e-6)) * 4 / 3)); aspect-ratio: 4 / 3; }
.img canvas { width: 100%; height: 100%; display: block; }
.caixa { position: absolute; border: 2px solid; border-radius: 2px; }
.caixa.selecionada { box-shadow: 0 0 0 2px var(--branco); }
.etq { position: absolute; left: -2px; bottom: 100%; margin-bottom: 2px; white-space: nowrap; font-size: var(--t-2); line-height: var(--a-2); padding: 0 var(--e-1); border-radius: 2px; background: var(--rotulo-imagem); color: var(--branco); }
.escala { position: absolute; right: var(--e-5); top: var(--e-6); bottom: var(--e-6); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; gap: var(--e-1); color: var(--palco-texto); font-size: var(--t-2); }
.escala canvas { width: var(--e-4); height: 100%; border-radius: 2px; }
.ferr { position: absolute; left: var(--e-4); top: var(--e-4); display: grid; gap: var(--e-1); background: var(--palco-2); border-radius: var(--r-m); padding: var(--e-1); color: var(--palco-texto); }
.ferr button { width: var(--alvo); height: var(--alvo); display: grid; place-items: center; border-radius: var(--r-p); }
.ferr button.on { background: var(--hover-claro); color: var(--branco); }
.faixa { display: flex; gap: var(--e-2); overflow-x: auto; padding: var(--e-3) var(--e-4); border-top: 1px solid var(--borda); }
.chip { flex: none; display: grid; grid-template-columns: 4px auto; gap: var(--e-1) var(--e-3); align-items: center; text-align: left; padding: var(--e-2) var(--e-4) var(--e-2) 0; border: 1px solid var(--borda); border-radius: var(--r-m); overflow: hidden; }
.chip i { grid-row: span 2; align-self: stretch; background: var(--sev); }
.chip span { font-size: var(--t-2); color: var(--texto-2); }
.chip b { font-size: var(--t-3); }
.chip.sel { border-color: var(--acao); box-shadow: inset 0 0 0 1px var(--acao); }
.direita { border-left: 1px solid var(--borda); padding: var(--e-5) var(--e-6); display: grid; gap: var(--e-5); align-content: start; overflow: auto; }
.direita .tmax b { font-size: var(--t-6); line-height: var(--a-6); }
.direita .tmax { display: flex; align-items: center; gap: var(--e-3); }
.par { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e-3); }
.par div span { display: block; font-size: var(--t-2); color: var(--texto-3); }
.par div b { font-size: var(--t-4); line-height: var(--a-4); }
.acao { border-left: 4px solid var(--imediato); padding-left: var(--e-3); }
.acao span { display: block; font-size: var(--t-2); color: var(--texto-2); }
dl { display: grid; grid-template-columns: auto 1fr; gap: var(--e-1) var(--e-3); font-size: var(--t-2); }
dt { color: var(--texto-3); }
dd { text-align: right; font-weight: var(--p-medio); }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
</style>
</head>
<body>
<header class="topo">
  <div class="marca"><img src="../../../app/estatico/marca/icone-192.png" alt="">Pyron</div>
  <nav class="nav" id="nav"></nav>
  <div class="dir">
    <button aria-label="Buscar (Ctrl K)"><svg class="ic"><use href="#i-busca"/></svg></button>
    <button aria-label="Alertas"><svg class="ic"><use href="#i-sino"/></svg></button>
    <button aria-label="Configurações"><svg class="ic"><use href="#i-config"/></svg></button>
  </div>
</header>

<section class="tela" id="t-painel">
  <div class="cab"><h1>Painel</h1><div class="acoes"><button class="btn pri"><svg class="ic"><use href="#i-importar"/></svg>Importar termogramas</button></div></div>
  <div class="grade">
    <div class="fila"><h2>Atenção agora</h2><div id="atencao"></div></div>
    <div class="lado">
      <div class="blocos" id="ind"></div>
      <div><h2>Próximas inspeções</h2><ul class="prox" id="prox"></ul></div>
    </div>
  </div>
</section>

<section class="tela" id="t-analise">
  <div class="cab" id="cab-analise"></div>
  <div class="area">
    <div class="esq">
      <div class="quadro">
        <div class="img" id="img"><canvas id="termo"></canvas></div>
        <div class="ferr">
          <button class="on" aria-label="Selecionar"><svg class="ic"><use href="#i-selecionar"/></svg></button>
          <button aria-label="Nova região"><svg class="ic"><use href="#i-regiao"/></svg></button>
          <button aria-label="Ponto"><svg class="ic"><use href="#i-ponto"/></svg></button>
          <button aria-label="Linha"><svg class="ic"><use href="#i-linha"/></svg></button>
          <button aria-label="Camadas"><svg class="ic"><use href="#i-camadas"/></svg></button>
        </div>
        <div class="escala"><span>60</span><canvas id="escala"></canvas><span>22</span></div>
      </div>
      <div class="faixa" id="faixa"></div>
    </div>
    <div class="direita" id="det"></div>
  </div>
</section>
<script src="comum/icones.js"></script>
<script src="comum/dados.js"></script>
<script src="comum/termograma.js"></script>
<script src="comum/medir.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const NAV = [["painel", "Painel"], ["inspecoes", "Inspeções"], ["equipamentos", "Equipamentos"], ["pendencias", "Pendências", 3], ["captura", "Captura"], ["modelos", "Modelos"]];

function montar() {
  const tela = location.hash === "#analise" ? "analise" : "painel";
  document.querySelectorAll(".tela").forEach((t) => t.classList.toggle("ativa", t.id === `t-${tela}`));
  const ativo = tela === "analise" ? "inspecoes" : "painel";
  $("#nav").innerHTML = NAV.map(([id, n, c]) => `<a href="#" class="${id === ativo ? "ativo" : ""}">${n}${c ? `<span class="cont">${c}</span>` : ""}</a>`).join("");
}

function painel() {
  const P = DADOS.painel;
  $("#atencao").innerHTML = P.atencao.map((a) => `<div class="grande" style="--sev:var(--${a.severidade})"><i></i><div class="eq"><b>${a.equipamento}</b><span>${a.instalacao}, ${a.regiao}, ${a.criterio}</span></div><div class="t"><b class="num">${fmt(a.tmax)} °C</b><span class="selo ${a.severidade}">${NIVEIS[a.severidade]}</span></div></div>`).join("");
  $("#ind").innerHTML = P.indicadores.map((k) => `<button class="bloco" style="${k.severidade ? `--sev:var(--${k.severidade}-texto)` : ""}"><b class="num">${k.valor}</b><span>${k.rotulo}</span></button>`).join("");
  $("#prox").innerHTML = P.proximas.map((p) => `<li><span>${p.equipamento}</span><span class="${p.atraso.startsWith("vencida") ? "venc" : ""}">${p.atraso}</span></li>`).join("");
}

function analise() {
  const A = DADOS.analise;
  const sel = A.regioes[0];
  $("#cab-analise").innerHTML = `<button class="btn ic-so" aria-label="Anterior">${ic("anterior")}</button><div><h1>${A.equipamento}</h1><div class="meta"><span class="selo ${A.severidade}">${NIVEIS[A.severidade]}</span><span>${A.instalacao}</span><span>${A.data}</span><span>${A.posicao[0]} de ${A.posicao[1]}</span></div></div><button class="btn ic-so" aria-label="Próxima">${ic("proxima")}</button><div class="acoes"><button class="btn">${ic("detectar")}Detectar de novo</button><button class="btn ic-so" aria-label="Mais">${ic("mais")}</button><button class="btn pri">${ic("laudo")}Gerar laudo</button></div>`;
  desenharTermograma($("#termo"));
  desenharEscala($("#escala"));
  caixasRegioes($("#img"), A.regioes, { selecionada: sel.id });
  $("#faixa").innerHTML = A.regioes.map((r) => `<button class="chip ${r.id === sel.id ? "sel" : ""}" style="--sev:var(--${r.severidade})"><i></i><span>${r.nome}</span><b class="num">${fmt(r.tmax)} °C</b></button>`).join("");
  const b = A.regioes[3];
  $("#det").innerHTML = `<div><h2>${sel.nome}, fase ${sel.fase}</h2></div>
    <div class="tmax"><b class="num">${fmt(sel.tmax)} °C</b><span class="selo ${sel.severidade}">${NIVEIS[sel.severidade]}</span></div>
    <div class="par"><div><span>ΔT entre fases</span><b class="num">${fmt(sel.dt)} °C</b></div><div><span>da MTA</span><b class="num">${sel.mta} %</b></div></div>
    <div class="acao"><b>${sel.acao}</b><span>${sel.criterio}.</span></div>
    <dl><dt>Pendência</dt><dd style="color:var(--erro-texto)">Aberta, prazo 13/10</dd><dt>Ambiente e carga</dt><dd class="num">${fmt(A.ambiente)} °C, ${A.carga} %</dd><dt>${b.nome} (estimado)</dt><dd class="num">${fmt(b.dimensoes.altura, 2)} × ${fmt(b.dimensoes.largura, 2)} m</dd></dl>`;
}

addEventListener("hashchange", montar);
addEventListener("DOMContentLoaded", () => { montar(); painel(); analise(); });
</script>
</body>
</html>
