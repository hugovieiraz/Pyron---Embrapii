<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1330">
<title>Pyron · fotos para medir</title>
<link rel="icon" href="/e/marca/icone-192.png">
<link rel="stylesheet" href="/e/tokens.css">
<link rel="stylesheet" href="/e/celular.css">
<link rel="stylesheet" href="/e/medir_celular.css">
</head>
<body>
<main class="med">
  <header class="cel-topo med-topo">
    <img class="cel-logo" src="/e/marca/icone-192.png" alt="">
    <div class="cel-titulo"><b>Pyron</b><span id="subtitulo"></span></div>
    <span class="med-ligado" id="ligado" role="status"></span>
  </header>

  <section class="med-acoes" aria-labelledby="titulo">
    <h1 id="titulo"></h1>
    <p class="med-dica" id="dica"></p>
    <button class="cel-btn med-tirar" type="button" id="btn-tirar"></button>
    <button class="cel-btn cel-btn-contorno" type="button" id="btn-video"></button>
    <button class="cel-btn cel-btn-contorno" type="button" id="btn-galeria"></button>
  </section>

  <section class="med-enviadas" aria-labelledby="titulo-enviadas" id="bloco-enviadas" hidden>
    <h2 id="titulo-enviadas"></h2>
    <ul class="med-lista" id="lista"></ul>
    <p class="cel-nota" id="nota-pc"></p>
  </section>

  <input type="file" id="arq-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="arq-video" accept="video/*" capture="environment" hidden>
  <input type="file" id="arq-galeria" accept="image/*,.heic,.heif,video/*" multiple hidden>
</main>
<script src="/e/textos.js"></script>
<script src="/e/medir_celular.js"></script>
</body>
</html>
