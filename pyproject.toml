[project]
name = "pyron"
version = "0.0.1"
description = "Previsão de falhas em equipamentos elétricos por termografia"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow", "scipy"]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime"]
# placa de vídeo no ao vivo (celular e vídeo); substitui o pacote "onnxruntime" (o mesmo módulo, com o DirectML)
placa = ["onnxruntime-directml"]
# arquivos das inspeções num bucket S3 ou compatível (PYRON_OBJETOS=s3://bucket/prefixo); sem isso, a pasta local
nuvem = ["boto3"]
dev = ["pytest", "matplotlib"]
# segmentação SAM 2 + metrologia (nucleo/segmentacao, nucleo/metrologia, nucleo/pipeline).
# torch/torchvision com CUDA vêm do índice do PyTorch, instalados ANTES deste extra:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
# o sam2 compila contra o torch instalado: SAM2_BUILD_CUDA=0 pip install --no-build-isolation -e .[segmentacao]
# (a extensão CUDA do sam2 é opcional; sem ela só o pós-processamento de buracos fica desligado)
# opencv: se o extra "ocr" já trouxe o opencv-python, ele fornece o mesmo módulo cv2; não instale os dois.
# pesos: python ferramentas/baixar_sam2.py
segmentacao = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "sam2 @ git+https://github.com/facebookresearch/sam2.git",
    "opencv-python-headless",
    "numpy",
    "scipy",
]

# medição em foto comum (nucleo/medicao): MoGe-2 (MIT) + SAM 2.1 pelo transformers (Apache 2.0).
# O pacote moge (github.com/microsoft/MoGe) traz o MoGe-3, que pede FlexGEMM/Triton e Gradio; o MoGe-2 não
# precisa deles, então ele entra sem dependências:  pip install --no-deps git+https://github.com/microsoft/MoGe.git
# pesos: python -m nucleo.medicao.modelos --baixar vitl small
medicao = [
    "torch>=2.4",
    "transformers>=4.56",
    "huggingface_hub",
    "opencv-python-headless",
    "utils3d_moge @ git+https://github.com/EasternJournalist/utils3d-moge.git@62f09d58509485564e24d5d9f6aac9ee9ebc0c37",
]

[tool.setuptools]
packages = [
    "nucleo", "nucleo.detectores", "nucleo.segmentacao", "nucleo.metrologia", "nucleo.pipeline", "nucleo.medicao",
    "src", "src.geometry", "src.segmentation", "src.pipeline"
]

[tool.pytest.ini_options]
testpaths = ["testes", "tests"]
pythonpath = [".", "src"]
